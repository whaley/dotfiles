# Whaley's config
# I try to do as much with the keyboard as I can, so there's a few bespoke exec-and-forget items in modes as well

# Tip: if you need to debug why an exec-and-forget command isn't working, try using
# ` exec > /tmp/aerospace.log 2>&1 ; env`
# before your command to redirect all stdout/stderr to a log file and also dump your environment variables

config-version = 2

# Startup Items
start-at-login = true
after-login-command = []
after-startup-command = [
    'exec-and-forget borders active_color="glow(0xFFFFFFFF)" inactive_color="glow(0xFF000000)" order="above"  width=2 style="uniform"'
]

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers                         = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 40
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Bring sticky windows (toggled in floating mode) along to the new workspace, if it's on the main monitor
exec-on-workspace-change = ['/bin/bash', '-c', 'aerospace_move_stickies.sh']
# don't move on focus change, this messes with multiple monitors and switching workspaces quickly
# on-focus-changed = ['move-mouse window-lazy-center']

automatically-unhide-macos-hidden-apps = false

# Workspace Setup
persistent-workspaces = ['Chat', 'Main', 'Organize']
[workspace-to-monitor-force-assignment]
    Main      = 'main'
    Organize  = 'secondary'
    Chat      = 'secondary'

# Setup environmental variables
[exec]
inherit-env-vars = true
[exec.env-vars]
PATH = "${HOME}/.local/bin:/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}"

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
# Kept just wide enough to fit the borders width (set in the borders commands)
[gaps.inner]
horizontal    = 2
vertical      = 2
[gaps.outer]
left          = 2
right         = 2
bottom        = 2
top           = 2


[mode.main.binding]

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
ctrl-alt-shift-comma        = 'layout floating tiling' #toggle floating / tiling for a single window
ctrl-alt-shift-period       = 'layout accordion horizontal vertical'

# Show the apps open on the focused workspace in a notification, each listed once.  Floating windows are marked with (F).
ctrl-alt-shift-slash        = '''exec-and-forget ws=$(aerospace list-workspaces --focused)
apps=$(aerospace list-windows --workspace focused --format '%{window-layout}|%{app-name}' | awk -F'|' '{ app = $0; sub(/^[^|]*\|/, "", app); if ($1 == "floating") app = app " (F)"; if (!seen[app]++) print app }' | paste -sd ',' - | sed 's/,/, /g')
terminal-notifier -title "Workspace: $ws" -message "${apps:-None}"
'''

cmd-ctrl-alt-shift-f        = 'fullscreen' #toggle fullscreen for a window

# See: https://nikitabobko.github.io/AeroSpace/commands#flatten-workspace-tree
cmd-ctrl-alt-shift-esc      = 'flatten-workspace-tree' #reset layout

# See: https://nikitabobko.github.io/AeroSpace/commands#balance-sizes
ctrl-alt-shift-esc          = 'balance-sizes'

# Minimize without making AeroSpace lose track of the workspace.  This is a bit of a hack, but it works.
# When a window is minimized, MacOS immediately focuses on the next window of that app, which may be on another workspace.
# This command remembers the current workspace, minimizes the window, then re-asserts the remembered workspace.
# This also keeps focus on the current workspace even if the minimized window was the last window in the workspace.
# The sleep check is to handle a timing issue with MacOS
cmd-m = '''exec-and-forget
currentWorkspace=$(aerospace list-workspaces --focused)
aerospace macos-native-minimize
sleep 0.2
[ "$(aerospace list-workspaces --focused)" = "$currentWorkspace" ] || aerospace workspace "$currentWorkspace"
'''

# Close window in an aerospace aware way; same as minimize above, but for closing a window
ctrl-alt-shift-w = '''exec-and-forget
currentWorkspace=$(aerospace list-workspaces --focused)
aerospace close
sleep 0.2
[ "$(aerospace list-workspaces --focused)" = "$currentWorkspace" ] || aerospace workspace "$currentWorkspace"
'''

# Navigation and moving windows
ctrl-alt-shift-j                = 'focus --ignore-floating left'
ctrl-alt-shift-k                = 'focus --ignore-floating down'
ctrl-alt-shift-i                = 'focus --ignore-floating up'
ctrl-alt-shift-l                = 'focus --ignore-floating right'

ctrl-alt-shift-left             = 'swap left'
ctrl-alt-shift-down             = 'swap down'
ctrl-alt-shift-up               = 'swap up'
ctrl-alt-shift-right            = 'swap right'

cmd-ctrl-alt-shift-j            = 'move left'
cmd-ctrl-alt-shift-k            = 'move down'
cmd-ctrl-alt-shift-i            = 'move up'
cmd-ctrl-alt-shift-l            = 'move right'

cmd-ctrl-alt-shift-left         = 'join-with left'
cmd-ctrl-alt-shift-down         = 'join-with down'
cmd-ctrl-alt-shift-up           = 'join-with up'
cmd-ctrl-alt-shift-right        = 'join-with right'

# Resize windows
ctrl-alt-shift-minus            = 'resize smart          -100'
ctrl-alt-shift-equal            = 'resize smart          +100'
ctrl-alt-shift-cmd-minus        = 'resize smart-opposite -100'
ctrl-alt-shift-cmd-equal        = 'resize smart-opposite +100'

# Workspaces
ctrl-alt-shift-tab              = 'workspace-back-and-forth'
ctrl-alt-shift-n                = 'workspace next --wrap-around'
ctrl-alt-shift-p                = 'workspace prev --wrap-around'
cmd-ctrl-alt-shift-n            = 'move-node-to-workspace next --wrap-around --focus-follows-window'
cmd-ctrl-alt-shift-p            = 'move-node-to-workspace prev --wrap-around --focus-follows-window'

# Monitors
ctrl-alt-shift-m                = 'focus-monitor next --wrap-around'
cmd-ctrl-alt-shift-m            = 'move-node-to-monitor next --wrap-around --focus-follows-window'
cmd-ctrl-alt-shift-backslash    = 'move-workspace-to-monitor next --wrap-around'


# Switch Modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
ctrl-alt-shift-o                = 'mode open'
ctrl-alt-shift-u                = 'mode util'
ctrl-alt-shift-b                = 'mode borders'
ctrl-alt-shift-f                = ['mode floating', 'exec-and-forget aerospace_floating_mode.sh enter']



#######################################
# Mode: Open Apps and Windows
#######################################
[mode.open.binding]
esc                         = 'mode main'

# Open iTerm if needed, or create new window
t =  ['''exec-and-forget osascript -e '
if application "iTerm" is running then
    tell application "iTerm"
        set newWindow to (create window with default profile)
    end tell
else
    tell application "iTerm"
        activate
    end tell
end if
'
''', 'mode main']


# Open Omnifocus in a new window
f = ['''exec-and-forget osascript -e '
if application "Omnifocus" is running then
    tell application "OmniFocus"
        tell default document
            make new document window
        end tell
    end tell
else
    tell application "OmniFocus"
        activate
    end tell
end if
'
''', 'mode main']

# Open a new Kitty OS Window.  Kitty needs allow_remote_control socket_only in its config.
# If kitty is already running, ask it for another OS window over its remote control
# socket.  If it isn't, launch it through LaunchServices (so macOS still keeps a single
# kitty instance) and just take the window it opens on its own.
k = ['''exec-and-forget kitty_pid=$(pgrep -x kitty | head -1)
if [ -n "$kitty_pid" ]; then
    current_workspace=$(aerospace list-workspaces --focused)
    # kitty often hands focus back to its previous key window right after creating the
    # new one, so find the new window and focus it explicitly.  The trailing "none"
    # keeps grep from excluding everything when kitty has no windows open.
    known_ids=$(aerospace list-windows --monitor all --pid "$kitty_pid" --format '%{window-id}'; echo none)
    kitten @ --to "unix:/tmp/kitty-socket-$kitty_pid" launch --type os-window
    for _ in {1..50}; do
        new_id=$(aerospace list-windows --monitor all --pid "$kitty_pid" --format '%{window-id}' | grep -vxF "$known_ids" | head -1)
        [ -n "$new_id" ] && break
        sleep 0.1
    done
    # kitty may open the window on its previous key window's workspace, so pull it back
    # to the workspace we started on before focusing it
    [ -n "$new_id" ] && aerospace move-node-to-workspace --focus-follows-window --window-id "$new_id""$current_workspace"
else
    open -a kitty
fi
''', 'mode main']

# Open a new Kitty OS Window and connect it to weechat on screen on my remote host.
# If a weechat window is already open, pull it onto the current workspace and focus it.
w = ['''exec-and-forget kitty_pid=$(pgrep -x kitty | head -1)
if [ -n "$kitty_pid" ]; then
    weechat_window=$(aerospace list-windows --monitor all --pid "$kitty_pid" --format '%{window-id}|%{workspace}|%{window-title}' | awk -F'|' '$3 == "weechat" { print $1, $2; exit }')
    if [ -n "$weechat_window" ]; then
        weechat_id=${weechat_window%% *}
        weechat_workspace=${weechat_window#* }
        current_workspace=$(aerospace list-workspaces --focused)
        aerospace focus --window-id "$weechat_id"
    else
        kitten @ --to "unix:/tmp/kitty-socket-$kitty_pid" launch --type os-window --os-window-title weechat mosh prisoner.morninghacks.com -- screen -raAd weechat
    fi
else
    # launch kitty untitled and title just this window over remote control instead
    # using --title
    open -a kitty --args mosh prisoner.morninghacks.com -- screen -raAd weechat
    sleep 2
    kitty_pid=$(pgrep -x kitty | head -1)
    kitten @ --to "unix:/tmp/kitty-socket-$kitty_pid" set-window-title weechat
fi
''', 'mode main']



# Apps with only a single window or can't otherwise support applescript
# e.g. PWA's or Electron apps
#1Password
1 = ['exec-and-forget aerospace_open_or_move_to_current_workspace.py "1Password"', 'mode main']

#Claude
# Always bring Claude to the workspace visible on the main monitor, even if focus is on
# another monitor.  Switch to that workspace first so a freshly launched Claude opens there too.
c = ['''exec-and-forget main_monitor=$(aerospace list-monitors --format '%{monitor-id}|%{monitor-is-main}' | awk -F'|' '$2 == "true" { print $1; exit }')
main_workspace=$(aerospace list-workspaces --monitor "$main_monitor" --visible)
for id in $(aerospace list-windows --monitor all --app-bundle-id com.anthropic.claudefordesktop --format '%{window-id}'); do
    aerospace move-node-to-workspace --window-id "$id" "$main_workspace"
done
aerospace workspace "$main_workspace"
open -a Claude
''', 'mode main']

#Apple Music
m = ['exec-and-forget aerospace_open_or_move_to_current_workspace.py "Music" --app-path "/System/Applications/Music.app"', 'mode main']

#Calendar
d = ['exec-and-forget aerospace_open_or_move_to_current_workspace.py "Calendar" --app-path "/System/Applications/Calendar.app"', 'mode main']

#Brain.fm
b = ['exec-and-forget aerospace_open_or_move_to_current_workspace.py "Brain.fm"', 'mode main']

#Obsidian
# If Obsidian already has a window on Organize, focus it.  Otherwise let `open -a` launch
# or activate Obsidian and bring its window forward on its own.
o = ['''exec-and-forget obsidian_id=$(aerospace list-windows --workspace Organize --app-bundle-id md.obsidian --format '%{window-id}' | head -1)
if [ -n "$obsidian_id" ]; then
    aerospace focus --window-id "$obsidian_id"
else
    open -a Obsidian
fi
''', 'mode main']

#Vitamin R
r = ['exec-and-forget aerospace_open_or_move_to_current_workspace.py "Vitamin-R 4"', 'mode main']

# Browsers

#Safari
s = ['''exec-and-forget osascript -e '
if application "Safari" is running then
    tell application "Safari"
        make new document at end of documents
        activate
    end tell
else
    tell application "Safari"
        activate
    end tell
end if
'
''', 'mode main']

# Zen
z = ['exec-and-forget Applications/Zen.app/Contents/MacOS/zen --new-window', 'mode main']

[mode.util.binding]
esc = 'mode main'

r = ['reload-config', 'mode main']

f = ['mode main', 'macos-native-fullscreen'] #make 'mode main' first, since native command must appear last in a list

# Toggle minimize everything on current workspace
# Also restores focus back to the workspace we just minimized everything on
m = ['''exec-and-forget
currentWorkspace=$(aerospace list-workspaces --focused)
for id in $(aerospace list-windows --workspace focused | awk '{print $1}'); do
    aerospace macos-native-minimize --window-id "$id"
done
aerospace workspace "$currentWorkspace"
''', 'mode main']

# Toggle headpones being connected
# NOTE: This requires giving Aerospace permission to use Bluetooth in System Settings > Privacy and Security > Bluetooth
h = ['''exec-and-forget
toggle_bt.sh "Grey WH-1000XM5"
''', 'mode main']

# Move focused window the edge of the screen so it takes up the full height or width of the screen based on direction
left    = ['exec-and-forget aerospace_move_to_edge.py left', 'mode main']
right   = ['exec-and-forget aerospace_move_to_edge.py right', 'mode main']
up      = ['exec-and-forget aerospace_move_to_edge.py up', 'mode main']
down    = ['exec-and-forget aerospace_move_to_edge.py down', 'mode main']

# Retile all windows on the current workspace so all windows are the same size (unless an odd number)
t = ['''exec-and-forget  aerospace_retile_windows.py''', 'mode main']


#######################################
# Mode: Floating Window Management
#######################################
[mode.floating.binding]
# Raise the tiled windows back over the floating ones and refocus the window from before floating mode
ctrl-alt-shift-esc          = ['exec-and-forget aerospace_floating_mode.sh exit', 'mode main']
ctrl-alt-shift-f            = ['exec-and-forget aerospace_floating_mode.sh exit', 'mode main']

# Cycle focus through the floating windows on this workspace
ctrl-alt-shift-j            = 'exec-and-forget aerospace_cycle_floating.sh prev'
ctrl-alt-shift-i            = 'exec-and-forget aerospace_cycle_floating.sh prev'
ctrl-alt-shift-k            = 'exec-and-forget aerospace_cycle_floating.sh next'
ctrl-alt-shift-l            = 'exec-and-forget aerospace_cycle_floating.sh next'

# Show every floating window, and its workspace, in a notification.  The title is the last field
# and is taken from everything after the third "|" in case the title has a "|" in it.
shift-slash                 = '''exec-and-forget windows=$(aerospace list-windows --all --format '%{window-layout}|%{workspace}|%{app-name}|%{window-title}' | awk -F'|' '$1 == "floating" { title = $0; sub(/^[^|]*\|[^|]*\|[^|]*\|/, "", title); print $2 ": " $3 " — " title }')
terminal-notifier -title "Floating windows" -message "${windows:-None}"
'''

# Toggle whether the focused window is sticky (follows you between workspaces on the main monitor)
ctrl-alt-shift-s            = '''exec-and-forget aerospace_toggle_sticky.sh --notify "$(aerospace list-windows --focused --format '%{window-id}')"'''

# Note: just use the mouse/trackpad you dolt
# # Move by 100px
# ctrl-alt-shift-left         = 'exec-and-forget aerospace_adjust_floating.sh -100 0 0 0'
# ctrl-alt-shift-down         = 'exec-and-forget aerospace_adjust_floating.sh 0 100 0 0'
# ctrl-alt-shift-up           = 'exec-and-forget aerospace_adjust_floating.sh 0 -100 0 0'
# ctrl-alt-shift-right        = 'exec-and-forget aerospace_adjust_floating.sh 100 0 0 0'

# # Grow 100px in a direction (that edge moves out, the opposite edge stays put)
