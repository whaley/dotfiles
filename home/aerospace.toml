# ctrl-alt-shift-down         = 'exec-and-forget aerospace_adjust_floating.sh 0 0 0 100'
# ctrl-alt-shift-up           = 'exec-and-forget aerospace_adjust_floating.sh 0 -100 0 100'
# ctrl-alt-shift-right        = 'exec-and-forget aerospace_adjust_floating.sh 0 0 100 0'

# # Shrink 100px to a direction, That edge stays put. The opposite edge moves in.
# # e.g. left shrinks the right edge
# cmd-ctrl-alt-shift-left     = 'exec-and-forget aerospace_adjust_floating.sh 0 0 -100 0'
# cmd-ctrl-alt-shift-down     = 'exec-and-forget aerospace_adjust_floating.sh 0 100 0 -100'
# cmd-ctrl-alt-shift-up       = 'exec-and-forget aerospace_adjust_floating.sh 0 0 0 -100'
# cmd-ctrl-alt-shift-right    = 'exec-and-forget aerospace_adjust_floating.sh 100 0 -100 0'

# Grow / shrink every edge by 25px
ctrl-alt-shift-equal        = 'exec-and-forget aerospace_adjust_floating.sh -25 -25 50 50'
ctrl-alt-shift-minus        = 'exec-and-forget aerospace_adjust_floating.sh 25 25 -50 -50'


#######################################
# Mode: Janky borders!
#######################################
[mode.borders.binding]
# red/pink
r = ['exec-and-forget borders active_color="glow(0xFFFF69B4)" inactive_color="glow(0xFF000000)" order="above" width=2 style="uniform"', 'mode main']
# green
g = ['exec-and-forget borders active_color="glow(0xFFADFF2F)" inactive_color="glow(0xFF000000)" order="above" width=2 style="uniform"', 'mode main']
# blue
b = ['exec-and-forget borders active_color="glow(0xFF87CEFA)" inactive_color="glow(0xFF000000)" order="above" width=2 style="uniform"', 'mode main']
# purple
p = ['exec-and-forget borders active_color="glow(0xFFB069DB)" inactive_color="glow(0xFF000000)" order="above" width=2 style="uniform"', 'mode main']
# yellow
y = ['exec-and-forget borders active_color="glow(0xFFFBEC5D)" inactive_color="glow(0xFF000000)" order="above" width=2 style="uniform"', 'mode main']
# orange
o = ['exec-and-forget borders active_color="glow(0xFFFFE4B5)" inactive_color="glow(0xFF000000)" order="above" width=2 style="uniform"', 'mode main']
# white
w = ['exec-and-forget borders active_color="glow(0xFFFFFFFF)" inactive_color="glow(0xFF000000)" order="above" width=2 style="uniform"', 'mode main']

# no borders
k = ['exec-and-forget killall borders', 'mode main']

esc = 'mode main'

###############################################################################
# On-window-detected callbacks
###############################################################################

# Chat workspace
[[on-window-detected]]
    # WeeChat runs in a kitty window, so match on the window title (regex is case insensitive)
    if.window-title-regex-substring = '^weechat$'
    run = ['layout floating']
[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    run = ['move-node-to-workspace --focus-follows-window Chat']
[[on-window-detected]]
    if.app-id = 'com.hnc.Discord'
    run = ['move-node-to-workspace --focus-follows-window Chat']
[[on-window-detected]]
    if.app-id = 'com.apple.MobileSMS'
    run = ['move-node-to-workspace --focus-follows-window Chat']


# Floating windows
[[on-window-detected]]
    if.app-id = 'com.anthropic.claudefordesktop'
    run = ['layout floating']
[[on-window-detected]]
    if.app-id = 'md.obsidian'
    run = ['layout floating']
[[on-window-detected]]
    if.app-id = 'net.publicspace.dist.vitaminr4'
    run = ['layout floating']
